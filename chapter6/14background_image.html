<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>3.배경속성</title>
    <style>
        body {
            /*코드6-14 2)배경이미지 1개 삽입
            background-image: url('BackgroundFront.png');*/

            /*코드6-15 2)배경이미지 2개 삽입*/
            background-image: url('BackgroundFront.png'),
                              url('BackgroundBack.png');

            /*배경이미지 너비 조정*/
            background-size: 100%;
        }
    </style>
</head>

<body>
    <h2>6.3.1 배경 이미지 삽입과 크기 지정(예제6-14 ~ 6-18)</h2>
    <h3>ㆍbackground-image: 배경 이미지 삽입</h3>
    <h3>ㆍbackground-size: 배경 이미지 크기 지정</h3>
    <h3>ㆍbackground-repeat: 배경 이미지 형태 지정</h3>
    <h3>ㆍbackground-attachment: 배경 이미지 부착 형태 지정</h3>
    <h3>ㆍbackground-position: 배경 이미지 위치 지정</h3>
</body>

</html>
